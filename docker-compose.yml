services:
  mongodb:
    image: mongo:7
    container_name: airport_intelligence_mongodb
    restart: unless-stopped
    ports:
      # 27017 no host pertence ao mongod local do Windows -> publica-se em 27018.
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: airport
      MONGO_INITDB_ROOT_PASSWORD: airport123
      MONGO_INITDB_DATABASE: airport_intelligence
    volumes:
      - mongodb_data:/data/db

  postgres:
    image: postgres:16
    container_name: airport_intelligence_postgres
    restart: unless-stopped
    ports:
      # 5432 no host pertence ao postgres local do Windows -> publica-se em 5433.
      - "5433:5432"
    environment:
      POSTGRES_DB: airport_intelligence
      POSTGRES_USER: airport
      POSTGRES_PASSWORD: airport123
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nodered:
    image: nodered/node-red:latest
    container_name: airport_intelligence_nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    environment:
      TZ: Europe/Lisbon
      # O CSV do BTS descomprimido (~232 MB) e processado em memoria: sobe-se o heap.
      NODE_OPTIONS: --max-old-space-size=4096
    volumes:
      - ./node-red/data:/data
    depends_on:
      - mongodb

  grafana:
    image: grafana/grafana:11.5.2
    container_name: airport_intelligence_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - postgres

volumes:
  mongodb_data:
  postgres_data:
  grafana_data:
